<!doctype html><html lang="en"><meta charset="utf-8"><title>Original scene layout inspection</title><style>body{margin:0;background:#112426;color:#e7c478;font:14px system-ui}nav{height:42px;display:flex;align-items:center;gap:12px;padding:0 18px}button{background:#24413b;color:inherit;border:1px solid #9d8c55;padding:7px 18px;cursor:pointer}canvas{display:block;width:1280px;height:720px}small{opacity:.75}</style><nav><button onclick="show('title')">Title</button><button onclick="show('props')">Main menu</button><small>Shared scene-data preview · not an Android device capture</small></nav><canvas width="1280" height="720"></canvas><script>
let data,images={},scene='title';const c=document.querySelector('canvas').getContext('2d');
async function start(){data=await(await fetch('/assets/game-data.json')).json();const names=[...new Set(Object.values(data.scenes).flatMap(s=>s.draw.map(d=>d.atlas)))];await Promise.all(names.map(async n=>{const img=new Image();img.src='/assets/'+data.atlases[n].file;await img.decode();images[n]=img;}));show('title');window.previewReady=true;}
function show(name){if(!data)return;scene=name;c.fillStyle='#ea8e44';c.fillRect(0,0,1280,720);for(const d of data.scenes[name].draw){const f=data.atlases[d.atlas].frames[d.frame],r=f.rect,t=f.trim,s=f.size,[x,y,w,h]=d.rect,sx=w/s[0],sy=h/s[1],dx=x+t[0]*sx,dy=y+t[1]*sy,dw=t[2]*sx,dh=t[3]*sy;c.save();if(f.rotated){c.translate(dx,dy+dh);c.rotate(-Math.PI/2);c.drawImage(images[d.atlas],...r,0,0,dh,dw);}else c.drawImage(images[d.atlas],...r,dx,dy,dw,dh);c.restore();}}
start().catch(e=>{document.querySelector('small').textContent=e.stack;console.error(e)});
</script></html>
